<video #video class="camera-video" autoplay muted playsinline></video>
@if(debugCamera()) {
    <pre class="camera-debug">{{ debugCamera() }}</pre>
}
<div class="resolution up" (click)="resolution('up')"></div>
<div class="resolution down" (click)="resolution('down')"></div>
<div #viewsFrenzy class="right-action up"></div>
<div class="right-action down" (click)="likeFrenzy()"></div>
