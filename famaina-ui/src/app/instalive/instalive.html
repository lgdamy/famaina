<div class="insta-container">
  <app-livecam></app-livecam>
    <div class="right-click-area" (click)="incrementViewCount()"></div>
    <div class="top-left">
        <div class="profile-pic"></div>
        <div class="bubble">{{username}}</div>
    </div>
    <div class="top-right">
        <div class="live bubble">{{'buttons.live' | translate}}</div>
        <div class="viewers bubble"><mat-icon>visibility</mat-icon>{{compactNumber.format(viewCount())}}</div>
        <button matIconButton type="button" class="exit-button" (click)="encerrar()"><mat-icon>close</mat-icon></button>
    </div>
</div>
